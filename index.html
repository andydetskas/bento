  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --header-height: 64px;
      --font: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font);
      background: #111111;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ─── HEADER ─────────────────────────────────────────── */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: var(--header-height);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: #111111;
    }

    .header-logo {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      filter: invert(1);
    }

    .header-name {
      font-size: 15px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.02em;
    }

    /* ─── SCROLL CONTAINER ───────────────────────────────── */

    .scroll-container {
      padding-top: var(--header-height);
    }

    /* ─── BAND ───────────────────────────────────────────── */

    .band {
      display: block;
      width: 100%;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      padding: 18px 24px 22px;
      transition: filter 0.12s ease;
    }

    .band:hover {
      filter: brightness(0.92);
    }

    .band:active {
      filter: brightness(0.82);
    }

    /* Accent strip at top of each band */
    .band::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(0,0,0,0.15);
    }

    .band-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .band-platform {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    .band-arrow {
      font-size: 10px;
      opacity: 0;
      transform: translateX(-6px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      margin-left: auto;
      padding-right: 4px;
    }

    .band:hover .band-arrow {
      opacity: 0.5;
      transform: translateX(0);
    }

    .band-word {
      font-size: clamp(68px, 20vw, 116px);
      font-weight: 700;
      line-height: 0.88;
      letter-spacing: -0.035em;
    }

    /* ─── COLOR THEMES ───────────────────────────────────── */

    .band--charcoal  { background: #3535F5; color: #FFFFFF; }
    .band--orange    { background: #E84B2A; color: #000000; }
    .band--lavender  { background: #CBC5F5; color: #000000; }
    .band--coral     { background: #F2857A; color: #000000; }
    .band--amber     { background: #FFBB00; color: #000000; }
    .band--blue      { background: #000000; color: #FFFFFF; }
    .band--mint      { background: #B8F5CE; color: #000000; }
    .band--cream     { background: #F0EBE0; color: #000000; }

    /* ─── FOOTER ─────────────────────────────────────────── */

    .footer {
      padding: 28px 24px;
      background: #111111;
      color: rgba(255,255,255,0.25);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: center;
    }

    /* ─── MOBILE TWEAKS ──────────────────────────────────── */

    @media (max-width: 480px) {
      .band {
        padding: 14px 18px 18px;
      }
      .header {
        padding: 0 18px;
      }
    }

    /* ─── REDUCED MOTION ─────────────────────────────────── */

    @media (prefers-reduced-motion: reduce) {
      .band { transition: none; }
      .band-arrow { transition: none; }
    }
  </style>
</head>
